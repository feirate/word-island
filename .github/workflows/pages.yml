name: Deploy 词遇岛 to GitHub Pages

on:
  push:
    branches: [codex/first-playable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/first-playable'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build tools
        run: npm ci
      - name: Verify learning and storage behavior
        run: |
          node --test tests/*.test.js
          node --check src/app.js
          node --check src/world.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        run: npm run build
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
