name: Deploy 词遇岛 to GitHub Pages

on:
  push:
    branches: [codex/first-playable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/first-playable'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify learning and storage behavior
        run: |
          node --test tests/*.test.js
          node --check src/app.js
          node --check src/world.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R src vendor icons _site/
          find assets -type f \( \
            -name '*.glb' -o -name '*.gltf' -o -name '*.bin' -o \
            -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o \
            -name '*.webp' -o -name '*.svg' -o -name '*.ktx2' -o \
            -name '*.mp3' -o -name '*.m4a' -o -name '*.wav' -o \
            -name '*.ogg' -o -name '*.json' \
          \) -exec cp --parents -t _site {} +
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
